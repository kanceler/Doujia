<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg">
  <title>Doujia（豆荚）</title>
  <script>
    try {
      const rawPlatform = '{{{__platform__}}}';
      window.__platform__ = rawPlatform && !rawPlatform.includes('{{')
        ? JSON.parse(rawPlatform)
        : {};
    } catch (e) {
      console.error('Failed to parse __platform__', e);
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/client/src/index.tsx"></script>
</body>

</html>
